     Replaces the Elfsight WhatsApp Chat widget (removes its heavy platform.js,
     makes widget CLS structurally impossible, stays WCAG-accessible & crawlable).
     ---------------------------------------------------------------------
     WHERE TO PASTE:
       WPCode Lite → + Add Snippet → Add Your Custom Code → HTML Snippet
       Location: Site Wide Footer   |   Auto Insert: Active
       (An HTML snippet does apply the inline <style> below. Alternatively put the
        <a> in an HTML snippet and the CSS in a separate CSS Snippet.)
     Reversible: deactivate the snippet.

     COLOR NOTE (accessibility): background is #075E54 (dark WhatsApp green) which
     gives white icon/text ~7.67:1 — passes WCAG AA/AAA and the 3:1 non-text rule.
     Do NOT use #25D366 with white (only ~1.98:1 — fails). The focus ring #1a1a1a
     is visible on a light page background (change if the area is dark).

     SEQUENCING: publish this BEFORE deactivating the Elfsight plugin, then load a
     page and confirm only ONE WhatsApp button shows.
     REPLACE 16045551234 with the real number as DIGITS ONLY, international format
     (country code + number, no +, no spaces, no leading 00). Edit the pre-filled text.
     ===================================================================== -->
